name: Build SIGACEcyTEO Windows client
on:
  push:
    branches: [feature/server-client-apps]
  workflow_dispatch:
jobs:
  build-client:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install client runtime, QR and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/client/requirements.txt
          python -m pip install -r apps/client/requirements-qr.txt
          python -m pip install -r apps/client/requirements-build.txt
      - name: Test encrypted offline cache on Windows
        shell: pwsh
        run: |
          python -m pip install -r apps/client/requirements.txt
          python -m pip install -r apps/client/requirements-qr.txt
          python -m pytest -q apps/client/test_offline_vault.py
      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --collect-all cv2 --name SIGACEcyTEOCliente apps/client/client.py
      - name: Upload Windows client executable
        uses: actions/upload-artifact@v4
        with:
          name: SIGACEcyTEOCliente-Windows-x64
          path: dist/SIGACEcyTEOCliente.exe
          if-no-files-found: error
          retention-days: 30
